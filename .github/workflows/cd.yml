name: CD Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Incrementar versión y actualizar README
        run: |
          LAST=$(grep -oP 'AppVersion-\K[0-9]+' README.md | tail -1)
          if [ -z "$LAST" ]; then LAST=0; fi
          NEXT=$((LAST + 1))
          FECHA=$(date '+%d/%m/%Y %H:%M')
          echo "- AppVersion-$NEXT - $FECHA" >> README.md
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: bump de versión a $NEXT" || echo "Sin cambios que commitear"
          git push || echo "Nada que subir"

  validate-prod:
    needs: bump-version
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      
      - name: Validar entorno de producción
        env:
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
          LOCAL_PROD_TOKEN: ${{ secrets.LOCAL_PROD_TOKEN }}
        run: |
          if ($env:PROD_TOKEN -eq $env:LOCAL_PROD_TOKEN) {
            Write-Host "CD: validación de producción correcta ✅ — listo para desplegar"
          } else {
            Write-Host "CD: validación fallida ❌"
            exit 1
          }