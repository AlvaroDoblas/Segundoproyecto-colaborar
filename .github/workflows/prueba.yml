name: Prueba de Workflow

on:
  push:
    branches: [ main ]

jobs:
  test-secrets:
    runs-on: self-hosted
    steps:
      - name: Verificar ejecucion exitosa
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
        run: |
          echo "Ejecucion en el runner local completada con exito!"
          echo "DEV_TOKEN y PROD_TOKEN leidos correctamente."
