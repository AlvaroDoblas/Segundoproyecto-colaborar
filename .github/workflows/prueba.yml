name: Prueba de Workflow

on:
  push:
    branches: [ main ]

jobs:
  test-secrets:
    runs-on: self-hosted
    steps:
      - name: Comprobar Secrets
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
        run: |
          echo "Ejecutando pruebas en el runner local..."
          echo "DEV_TOKEN y PROD_TOKEN leídos correctamente."
